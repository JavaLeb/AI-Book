# 提供商基本信息.
provider: netease # 提供商名称.
label:
  en_US: "Netease"
description:
  en_US: "Models provided by netease."
  zh_Hans: "Netease 提供的模型。"
icon_small:
  en_US: "icon.svg"
icon_large:
  en_US: "icon.svg"
background: "#E5E7EB"

supported_model_types: # 提供商支持的模型类型.
  - text-embedding
configurate_methods:  # 配置方法
  - customizable-model
  - predefined-model

provider_credential_schema:
  credential_form_schemas:
    - label:
        en_US: Base URL
        zh_Hans: 基础 URL
      placeholder:
        en_US: Base url of Ollama server, e.g. http://192.168.1.100:11434
        zh_Hans: Ollama server 的基础 URL，例如 http://192.168.1.100:11434
      required: true
      type: text-input
      variable: base_url
    - default: '512'
      label:
        en_US: Model context size
        zh_Hans: 模型上下文长度
      placeholder:
        en_US: Enter your Model context size
        zh_Hans: 在此输入您的模型上下文长度
      required: true
      type: text-input
      variable: context_size
    - default: '20'
      label:
        en_US: Model max chunks
        zh_Hans: 模型最大块数量
      placeholder:
        en_US: Enter your Model max chunks
        zh_Hans: 在此输入您的模型最大块数量
      required: true
      type: text-input
      variable: max_chunks

model_credential_schema:
  credential_form_schemas:
  - label:
      en_US: Base URL
      zh_Hans: 基础 URL
    placeholder:
      en_US: Base url of Ollama server, e.g. http://192.168.1.100:11434
      zh_Hans: Ollama server 的基础 URL，例如 http://192.168.1.100:11434
    required: true
    type: text-input
    variable: base_url
  - default: '512'
    label:
      en_US: Model context size
      zh_Hans: 模型上下文长度
    placeholder:
      en_US: Enter your Model context size
      zh_Hans: 在此输入您的模型上下文长度
    required: true
    type: text-input
    variable: context_size
  - default: '20'
    label:
      en_US: Model max chunks
      zh_Hans: 模型最大块数量
    placeholder:
      en_US: Enter your Model max chunks
      zh_Hans: 在此输入您的模型最大块数量
    required: true
    type: text-input
    variable: max_chunks
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name
      zh_Hans: 输入模型名称


models:  # show models下会展示predefined类型的model.
  text_embedding:
    predefined:
      - models/text_embedding/*.yaml

extra:  # 其它配置.
  python:
    provider_source: provider/netease.py  # 提供商源码.
    model_sources: # 模型源码.
      - models/text_embedding/text_embedding.py
